services:
  - type: web
    name: alpha-quarante
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: cd backend && npm install --omit=dev
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: EMAIL_FROM_NAME
        value: ALPHA 40
      - key: INVITE_LINK
        value: https://meet.google.com/eyy-bofp-zyb
      - key: EVENT_LINK
        value: https://meet.google.com/eyy-bofp-zyb
      - key: FRONTEND_URL
        value: https://alpha-quarante.onrender.com
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
