# Garde le service Render éveillé (plan free) pour éviter les 502 au réveil.
name: Keep ALPHA 40 awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://alpha-quarante.onrender.com/api/health" || echo "000")
            echo "attempt=$i status=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 8
          done
          echo "Health ping failed after retries (non-blocking)"
          exit 0
