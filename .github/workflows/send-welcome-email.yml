name: Send ALPHA 40 welcome email

on:
  repository_dispatch:
    types: [send-welcome-email]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install nodemailer
        run: npm install nodemailer@6 --no-save

      - name: Send email
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          INVITE_LINK: ${{ secrets.INVITE_LINK }}
          MAIL_PRENOM: ${{ github.event.client_payload.prenom }}
          MAIL_EMAIL: ${{ github.event.client_payload.email }}
          MAIL_INVITE: ${{ github.event.client_payload.inviteLink }}
        run: node .github/scripts/send-welcome-email.js
